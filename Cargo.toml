[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
unhusk-dex = { path = "crates/dex" }
unhusk-apk = { path = "crates/apk" }
unhusk-vm = { path = "crates/vm" }
unhusk-engine = { path = "crates/engine" }
unhusk-report = { path = "crates/report" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
aes = "0.8"
hex = "0.4"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
regex = "1.13"
walkdir = "2.5"
rayon = "1.12"
tempfile = "3.27"
once_cell = "1.21"
